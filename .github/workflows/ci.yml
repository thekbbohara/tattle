name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - run: cargo build --release --locked
      - name: Demo prints the reel's numbers (exit 1 = critical flags found)
        run: |
          set +e
          ./target/release/tattle demo "$RUNNER_TEMP/demo" --json > demo.json
          test $? -eq 1
          grep -q '"commands": 1412' demo.json
